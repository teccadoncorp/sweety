services:
  web:
    build:
      context: ./frontend
    command: npm run dev
    environment:
      API_INTERNAL_URL: http://api:8000
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules

volumes:
  web_node_modules:
